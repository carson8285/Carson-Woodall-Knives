<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Knives | Carson Woodall Knives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="nav-bar">
  <a href="index.html#top" class="nav-left">
    <img
      src="./productimages/notxtlogowhite.svg"
      alt=""
      class="nav-logo-scorpion"
    />
    <img
      src="./productimages/textlogowhite.svg"
      alt="Carson Woodall Knives"
      class="nav-logo-textimg"
    />
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    <a href="./index.html#shop">SHOP</a>
    <a href="./index.html#about">ABOUT</a>
    <a href="./contact.html">CONTACT</a>
    <a href="./builder/index.html">KNIFE BUILDER</a>
  </nav>

  <div class="nav-right">
    <a href="./cart.html" class="nav-cart-btn" aria-label="Cart">
      <img src="./productimages/shopping-cart.svg" alt="cart" />
    </a>

    <button class="nav-menu-btn" type="button" aria-label="Toggle menu">
      <img src="./productimages/menulogo.svg" alt="menu" />
    </button>
  </div>
</header>

<main class="shop-page">
  <section class="shop-page-hero">
    <div class="shop-page-hero-inner">
      <h1 class="shop-page-heading">KNIVES</h1>
      <p class="shop-page-subheading">Browse available models.</p>
    </div>
  </section>

  <section class="shop-page-categories">
    <div class="shop-page-categories-inner">

      <div class="filters-bar">
        <div class="filters-left">
          <div class="filter">
            <label for="filterType">Type</label>
            <select id="filterType">
              <option value="all">All</option>
              <option value="edc">EDC</option>
              <option value="kitchen">Kitchen</option>
              <option value="hunting">Hunting / Bushcraft</option>
            </select>
          </div>

          <div class="filter">
            <label for="filterSteel">Steel</label>
            <select id="filterSteel">
              <option value="all">All</option>
              <option value="1095">1095 High Carbon</option>
              <option value="80crv2">80CRV2</option>
              <option value="stainless">Stainless</option>
            </select>
          </div>
        </div>

        <div class="filters-right">
          <div class="filter">
            <label for="sortBy">Sort</label>
            <select id="sortBy">
              <option value="featured">Featured</option>
              <option value="price-low">Price: Low → High</option>
              <option value="price-high">Price: High → Low</option>
              <option value="newest">Newest</option>
            </select>
          </div>

          <div class="filter search">
            <label for="search">Search</label>
            <input id="search" type="text" placeholder="Search knives..." />
          </div>
        </div>
      </div>

      <div class="listing-grid" id="listingGrid"></div>

    </div>
  </section>
</main>

<div class="section-divider"></div>
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-newsletter">
      <h2 class="footer-newsletter-heading">STAY CONNECTED</h2>

      <form class="footer-newsletter-form" action="https://formspree.io/f/xykygdje" method="post">
        <input
          type="email"
          name="email"
          placeholder="Email address"
          required
        />
        <input type="hidden" name="_next" value="https://carsonwoodallknives.com" />
        <button type="submit">SUBSCRIBE</button>
      </form>
    </div>

    <div class="footer-main">
      <nav class="footer-nav">
        <a href="./index.html#shop">SHOP</a>
        <a href="./index.html#about">ABOUT</a>
        <a href="./contact.html">CONTACT</a>
      </nav>

      <a href="#top" class="footer-logo-link">
        <img src="./productimages/logowhite.svg" alt="Carson Woodall Knives" class="footer-logo" />
      </a>

      <div class="footer-social">
        <a href="https://www.instagram.com/carsonwoodallknives" target="blank"
            aria-label="Instagram" class="footer-social-icon">IG</a>
        <a href="https://www.facebook.com/share/14HZGgMjPLt/?mibextid=wwXIfr" target="blank"
            aria-label="Facebook" class="footer-social-icon">F</a>
        <a href="https://www.youtube.com/@CWKnives" target="blank"
            aria-label="YouTube" class="footer-social-icon">YT</a>
      </div>
    </div>

    <div class="footer-copy">© 2025 CARSON WOODALL KNIVES</div>
  </div>
</footer>

<script>
  // nav open/close
  const navBar = document.querySelector('.nav-bar');
  const menuBtn = document.querySelector('.nav-menu-btn');
  const navLinks = document.querySelectorAll('.nav-links a');
  if (navBar && menuBtn) {
    menuBtn.addEventListener('click', () => navBar.classList.toggle('nav-bar--open'));
    navLinks.forEach(link => link.addEventListener('click', () => navBar.classList.remove('nav-bar--open')));
  }

  let products = [];

  const els = {
    grid: document.getElementById("listingGrid"),
    filterType: document.getElementById("filterType"),
    filterSteel: document.getElementById("filterSteel"),
    sortBy: document.getElementById("sortBy"),
    search: document.getElementById("search"),
  };

  function money(n) {
    return `$${Math.round(Number(n) || 0)}`;
  }

  function pillText(s) {
    return String(s || "").replace(/-/g, " ");
  }

  function getTypes(p) {
    if (Array.isArray(p.types) && p.types.length) {
      return p.types.map(t => String(t).toLowerCase());
    }

    // backward compatibility with old single-type products
    if (p.type) {
      const raw = String(p.type).toLowerCase();

      // map old values to new filter categories
      if (raw === "fixed") return ["edc"];
      if (raw === "hunting-bushcraft") return ["hunting-bushcraft"];

      return [raw];
    }

    // safe default for your current products
    return ["edc"];
  }

  function getPrimaryType(p) {
    return getTypes(p)[0] || "edc";
  }

  function getSteel(p) {
    if (p.steelTag) return String(p.steelTag).toLowerCase();
    if (p.steel) return String(p.steel).toLowerCase();

    const firstSteel = p?.options?.steel?.[0]?.id;
    if (firstSteel) return String(firstSteel).toLowerCase();

    return "";
  }

  function getAvailability(p) {
    return String(p.availability || "made-to-order").toLowerCase();
  }

  function getCardImage(p) {
    return (
      p.cardImage ||
      (Array.isArray(p.images) ? p.images[0] : null) ||
      p.image ||
      "./productimages/noimage.png"
    );
  }

  function getPrice(p) {
    return Number(p.basePrice ?? p.price ?? 0);
  }

  function render(list) {
    if (!list.length) {
      els.grid.innerHTML = `
        <div class="cart-empty">
          <p>No knives match those filters.</p>
        </div>
      `;
      return;
    }

    els.grid.innerHTML = list.map(p => {
      const img = getCardImage(p);
      const title = p.title || "Untitled";
      const price = getPrice(p);
      const primaryType = getPrimaryType(p);
      const steel = getSteel(p);
      const availability = getAvailability(p);

      return `
        <a class="listing-card" href="./product.html?id=${encodeURIComponent(p.id)}">
          <div class="listing-img">
            <img src="${img}" alt="${title}" />
          </div>
          <div class="listing-meta">
            <div class="listing-title">${title}</div>
            <div class="listing-sub">
              <span class="pill">${pillText(primaryType)}</span>
              ${steel ? `<span class="pill">${steel.toUpperCase()}</span>` : ``}
              <span class="pill">${pillText(availability)}</span>
            </div>
            <div class="listing-price">${money(price)}</div>
          </div>
        </a>
      `;
    }).join("");
  }

  function apply() {
    const t = els.filterType.value;
    const s = els.filterSteel.value;
    const q = els.search.value.trim().toLowerCase();
    const sort = els.sortBy.value;

    let list = products.filter(p => {
      const types = getTypes(p);
      const steel = getSteel(p);
      const availability = getAvailability(p);
      const title = (p.title || "").toLowerCase();

      const okType = (t === "all" || types.includes(t));
      const okSteel = (s === "all" || steel === s);

      const haystack = `${title} ${types.join(" ")} ${steel} ${availability}`.toLowerCase();
      const okSearch = (!q || haystack.includes(q));

      return okType && okSteel && okSearch;
    });

    if (sort === "featured") {
      list.sort((a, b) => Number(Boolean(b.featured)) - Number(Boolean(a.featured)));
    } else if (sort === "price-low") {
      list.sort((a, b) => getPrice(a) - getPrice(b));
    } else if (sort === "price-high") {
      list.sort((a, b) => getPrice(b) - getPrice(a));
    } else if (sort === "newest") {
      list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    }

    render(list);
  }

  function wireFilters() {
    ["change", "input"].forEach(evt => {
      els.filterType.addEventListener(evt, apply);
      els.filterSteel.addEventListener(evt, apply);
      els.sortBy.addEventListener(evt, apply);
      els.search.addEventListener(evt, apply);
    });
  }

  async function init() {
    try {
      const res = await fetch("./data/products.json", { cache: "no-store" });
      if (!res.ok) throw new Error(`Failed to load products.json (${res.status})`);

      const data = await res.json();
      products = Array.isArray(data) ? data : (data.products || []);

      if (!products.length) {
        els.grid.innerHTML = `
          <div class="cart-empty">
            <p>No products found.</p>
          </div>
        `;
        return;
      }

      wireFilters();
      apply();
    } catch (err) {
      console.error("Failed to load ./data/products.json", err);
      els.grid.innerHTML = `
        <div class="cart-empty">
          <p>Products failed to load.</p>
        </div>
      `;
    }
  }

  init();
</script>

</body>
</html>
