<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <title>Order Complete | Carson Woodall Knives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="top">

  <header class="nav-bar">
    <a href="index.html#top" class="nav-left">
      <img
        src="./productimages/notxtlogowhite.svg"
        alt=""
        class="nav-logo-scorpion"
      />
      <img
        src="./productimages/textlogowhite.svg"
        alt="Carson Woodall Knives"
        class="nav-logo-textimg"
      />
    </a>

    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html#shop">SHOP</a>
      <a href="index.html#about">ABOUT</a>
      <a href="./faq.html">FAQ</a>
      <a href="./contact.html">CONTACT</a>
    </nav>

    <div class="nav-right">
      <a href="./cart.html" class="nav-cart-btn" aria-label="Cart">
        <img src="./productimages/shopping-cart.svg" alt="cart" />
      </a>

      <button class="nav-menu-btn" type="button" aria-label="Toggle menu">
        <img src="./productimages/menulogo.svg" alt="menu" />
      </button>
    </div>
  </header>

  <main class="cart-page success-page">
    <section class="cart-hero">
      <div class="cart-hero-inner">
        <h1 class="cart-heading">ORDER COMPLETE</h1>
        <p class="cart-subheading">
          Payment successful. An order confirmation has been sent to your email.
        </p>
      </div>
    </section>

    <section class="cart-content">
      <div class="cart-inner">
        <div class="cart-items">
          <div class="cart-empty">
            <p id="statusMessage">Thank you for your order.</p>
            <a href="index.html#top" class="cart-empty-cta" id="backLink">
              RETURN HOME
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="section-divider"></div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-newsletter">
        <h2 class="footer-newsletter-heading">STAY CONNECTED</h2>

        <form class="footer-newsletter-form" action="https://formspree.io/f/xykygdje" method="post">
          <input
            type="email"
            name="email"
            placeholder="Email address"
            required
          />
          <input type="hidden" name="_next" value="https://carsonwoodallknives.com" />
          <button type="submit">SUBSCRIBE</button>
        </form>
      </div>

      <div class="footer-main">
        <nav class="footer-nav">
          <a href="index.html#shop">SHOP</a>
          <a href="index.html#about">ABOUT</a>
          <a href="./faq.html">FAQ</a>
          <a href="contact.html">CONTACT</a>
        </nav>

        <a href="#top" class="footer-logo-link">
          <img
            src="./productimages/logowhite.svg"
            alt="Carson Woodall Knives"
            class="footer-logo"
          />
        </a>

        <div class="footer-social">
          <a href="https://www.instagram.com/carsonwoodallknives" target="_blank"
             rel="noopener noreferrer" aria-label="Instagram" class="footer-social-icon">IG</a>
          <a href="https://www.facebook.com/share/14HZGgMjPLt/?mibextid=wwXIfr" target="_blank"
             rel="noopener noreferrer" aria-label="Facebook" class="footer-social-icon">F</a>
          <a href="https://www.youtube.com/@CWKnives" target="_blank"
             rel="noopener noreferrer" aria-label="YouTube" class="footer-social-icon">YT</a>
        </div>
      </div>

      <div class="footer-copy">
        © 2025 CARSON WOODALL KNIVES
      </div>
    </div>
  </footer>

  <script>
    const navBar = document.querySelector(".nav-bar");
    const menuBtn = document.querySelector(".nav-menu-btn");
    const navLinks = document.querySelectorAll(".nav-links a");
    const logoLink = document.querySelector(".footer-logo-link");

    if (logoLink) {
      logoLink.addEventListener("click", function (e) {
        if (window.scrollY > 20) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    }

    if (navBar && menuBtn) {
      menuBtn.addEventListener("click", () => {
        navBar.classList.toggle("nav-bar--open");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navBar.classList.remove("nav-bar--open");
        });
      });
    }
  </script>
</body>
</html>
