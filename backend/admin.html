<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orders Dashboard | Carson Woodall Knives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #050608;
      color: #f5f5f5;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: radial-gradient(circle at top left, #1c1f26, #050608 60%);
    }
    header h1 {
      font-size: 18px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0;
    }
    header span {
      font-size: 12px;
      color: #aaa;
    }
    main {
      padding: 16px 24px 40px;
    }
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .orders-table th,
    .orders-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #222;
      vertical-align: top;
    }
    .orders-table th {
      text-align: left;
      font-weight: 600;
      color: #bbb;
      background: #0c0f13;
    }
    .orders-table tr:nth-child(even) td {
      background: #070a0f;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #333;
      font-size: 11px;
      color: #ddd;
    }
    .small {
      font-size: 11px;
      color: #aaa;
    }
    .muted {
      color: #777;
    }
    .mono {
      font-family: "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono",
        "Courier New", monospace;
      font-size: 11px;
    }
    .no-orders {
      margin-top: 32px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ORDERS</h1>
      <span>Paid orders from Stripe Checkout</span>
    </div>
    <button id="refreshBtn">Refresh</button>
  </header>

  <main>
    <div id="ordersRoot">
      <p class="no-orders">Loading orders…</p>
    </div>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
