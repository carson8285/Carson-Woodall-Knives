<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Carson Woodall Knives</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="nav-bar">
  <!-- LEFT: logo (scorpion + text, both SVGs) -->
  <a href="index.html#top" class="nav-left">
    <img
      src="./productimages/notxtlogowhite.svg"
      alt=""
      class="nav-logo-scorpion"
    />
    <img
      src="./productimages/textlogowhite.svg"
      alt="Carson Woodall Knives"
      class="nav-logo-textimg"
    />
  </a>

  <!-- CENTER: links -->
  <nav class="nav-links" aria-label="Main navigation">
    <a href="./index.html#shop">SHOP</a>
    <a href="./index.html#about">ABOUT</a>
    <a href="./contact.html">CONTACT</a>
    <a href="./builder/index.html">KNIFE BUILDER</a>

  </nav>

  <!-- RIGHT: cart + menu -->
  <div class="nav-right">
    <a href="./cart.html" class="nav-cart-btn" aria-label="Cart">
      <img src="./productimages/shopping-cart.svg" alt="cart" />
    </a>

    <button class="nav-menu-btn" type="button" aria-label="Toggle menu">
      <img src="./productimages/menulogo.svg" alt="menu" />
    </button>
  </div>
</header>

  <!-- CONTACT PAGE WRAPPER -->
  <section class="contact-section">
    <div class="contact-inner">

      <h1 class="contact-heading">GET IN TOUCH</h1>
      <p class="contact-subheading">Questions • Business Inquiries</p>

      <form class="contact-form">
        <div class="form-field">
          <label>Your Name</label>
          <input type="text" required />
        </div>

        <div class="form-field">
          <label>Your Email</label>
          <input type="email" required />
        </div>

        <div class="form-field">
          <label>Your Message</label>
          <textarea rows="6" required></textarea>
        </div>

        <button class="contact-submit">SEND MESSAGE</button>
      </form>

      <p class="contact-note">
        I read every message personally. Expect a reply within 1–3 business days.
      </p>

    </div>
  </section>

<div class="section-divider"></div>
<footer class="footer">
  <div class="footer-inner">

    <!-- TOP: newsletter -->
    <div class="footer-newsletter">
      <h2 class="footer-newsletter-heading">STAY CONNECTED</h2>

      <form class="footer-newsletter-form" action="#" method="post">
        <input
          type="email"
          name="email"
          placeholder="Email address"
          required
        />
        <button type="submit">SUBSCRIBE</button>
      </form>
    </div>

    <!-- MIDDLE: nav · logo · socials -->
    <div class="footer-main">
      <nav class="footer-nav">
        <a href="index.html#shop">SHOP</a>
        <a href="index.html#about">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </nav>

      <a href="#top" class="footer-logo-link">
        <img
          src="./productimages/logowhite.svg"
          alt="Carson Woodall Knives"
          class="footer-logo"
        />
      </a>

      <div class="footer-social">
        <a
          href="https://www.instagram.com/carsonwoodallknives"
          target="blank"
          aria-label="Instagram"
          class="footer-social-icon"
        >IG</a>
        <a
          href="https://www.facebook.com/share/14HZGgMjPLt/?mibextid=wwXIfr"
          target="blank"
          aria-label="Facebook"
          class="footer-social-icon"
        >F</a>
        <a
          href="https://www.youtube.com/@CWKnives"
          target="blank"
          aria-label="YouTube"
          class="footer-social-icon"
        >YT</a>
      </div>
    </div>

    <!-- BOTTOM: copyright -->
    <div class="footer-copy">
      © 2025 CARSON WOODALL KNIVES
    </div>
  </div>
</footer>

<script>
  const navBar = document.querySelector('.nav-bar');
  const menuBtn = document.querySelector('.nav-menu-btn');
  const navLinks = document.querySelectorAll('.nav-links a');

  // Select your logo link (header or footer)
  const logoLink = document.querySelector('.nav-logo-btn, .footer-logo-link');

  if (logoLink) {
    logoLink.addEventListener('click', function (e) {
      // If NOT currently at the top of the page
      if (window.scrollY > 20) {
        e.preventDefault(); // stop link navigation
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      // ELSE let the default <a href="index.html"> work normally
    });
  }

  if (navBar && menuBtn) {
    menuBtn.addEventListener('click', () => {
      navBar.classList.toggle('nav-bar--open');
    });

    // close when clicking a nav link
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        navBar.classList.remove('nav-bar--open');
      });
    });
  }
</script>

</body>
</html>
