<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product | Carson Woodall Knives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="nav-bar">
  <a href="./index.html#top" class="nav-left">
    <img src="./productimages/notxtlogowhite.svg" alt="" class="nav-logo-scorpion" />
    <img src="./productimages/textlogowhite.svg" alt="Carson Woodall Knives" class="nav-logo-textimg" />
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    <a href="./index.html#shop">SHOP</a>
    <a href="./index.html#about">ABOUT</a>
    <a href="./faq.html">FAQ</a>
    <a href="./contact.html">CONTACT</a>
    <!--<a href="./builder/index.html">KNIFE BUILDER</a>-->
  </nav>

  <div class="nav-right">
    <a href="./cart.html" class="nav-cart-btn" aria-label="Cart">
      <img src="./productimages/shopping-cart.svg" alt="cart" />
    </a>

    <button class="nav-menu-btn" type="button" aria-label="Toggle menu">
      <img src="./productimages/menulogo.svg" alt="menu" />
    </button>
  </div>
</header>

<main class="product-page" style="padding-top:120px;">
  <section class="product-gallery" id="productRoot">
    <!-- LEFT: gallery -->
    <div class="main-image-container">
      <div class="gallery">
        <div class="gallery-main">
          <button class="gallery-nav prev" id="galleryPrev" type="button" aria-label="Previous image">‹</button>
          <img id="productMainImage" class="gallery-image" src="./productimages/noimage.png" alt="" />
          <button class="gallery-nav next" id="galleryNext" type="button" aria-label="Next image">›</button>
        </div>

        <div id="productThumbs" class="gallery-thumbs" style="margin-top:12px;"></div>
      </div>
    </div>

    <!-- RIGHT: options -->
    <div class="product-options">
      <h1 id="productTitle" style="letter-spacing:0.12em; text-transform:uppercase;">Loading…</h1>
      <p id="productDesc" style="opacity:0.85;"></p>

      <div class="price-addcart">
        <div class="price" id="productPrice">$0</div>
        <button class="add-cart" id="addToCartBtn" type="button">Add to Cart</button>
      </div>

      <div class="option-group">
        <label for="steelSelect">Steel</label>
        <select id="steelSelect"></select>
      </div>

      <div class="option-group">
        <label for="finishSelect">Finish</label>
        <select id="finishSelect"></select>
      </div>

      <div class="option-group">
        <label for="handleSelect">Handle</label>
        <select id="handleSelect"></select>
      </div>

      <div class="mini-specs" id="miniSpecs">
        <!-- JS fills -->
      </div>
    </div>
  </section>
</main>

<div class="section-divider"></div>
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-newsletter">
      <h2 class="footer-newsletter-heading">STAY CONNECTED</h2>

      <form class="footer-newsletter-form" action="https://formspree.io/f/xykygdje" method="post">
        <input
          type="email"
          name="email"
          placeholder="Email address"
          required
        />
        <input type="hidden" name="_next" value="https://carsonwoodallknives.com" />
        <button type="submit">SUBSCRIBE</button>
      </form>
    </div>

    <div class="footer-main">
      <nav class="footer-nav">
        <a href="./index.html#shop">SHOP</a>
        <a href="./index.html#about">ABOUT</a>
        <a href="./faq.html">FAQ</a>
        <a href="./contact.html">CONTACT</a>
      </nav>

      <a href="#top" class="footer-logo-link">
        <img src="./productimages/logowhite.svg" alt="Carson Woodall Knives" class="footer-logo" />
      </a>

      <div class="footer-social">
        <a href="https://www.instagram.com/carsonwoodallknives" target="blank"
            aria-label="Instagram" class="footer-social-icon">IG</a>
        <a href="https://www.facebook.com/share/14HZGgMjPLt/?mibextid=wwXIfr" target="blank"
            aria-label="Facebook" class="footer-social-icon">F</a>
        <a href="https://www.youtube.com/@CWKnives" target="blank"
            aria-label="YouTube" class="footer-social-icon">YT</a>
      </div>
    </div>

    <div class="footer-copy">© 2025 CARSON WOODALL KNIVES</div>
  </div>
</footer>

<script>
  // nav open/close
  const navBar = document.querySelector('.nav-bar');
  const menuBtn = document.querySelector('.nav-menu-btn');
  const navLinks = document.querySelectorAll('.nav-links a');
  if (navBar && menuBtn) {
    menuBtn.addEventListener('click', () => navBar.classList.toggle('nav-bar--open'));
    navLinks.forEach(link => link.addEventListener('click', () => navBar.classList.remove('nav-bar--open')));
  }
</script>

<!-- IMPORTANT: your real filename is products.js -->
<script src="./products.js"></script>
</body>
</html>
