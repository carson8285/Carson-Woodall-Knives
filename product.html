<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product | Carson Woodall Knives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="nav-bar">
  <a href="./index.html#top" class="nav-left">
    <img src="./productimages/notxtlogowhite.svg" alt="" class="nav-logo-scorpion" />
    <img src="./productimages/textlogowhite.svg" alt="Carson Woodall Knives" class="nav-logo-textimg" />
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    <a href="./index.html#shop">SHOP</a>
    <a href="./index.html#about">ABOUT</a>
    <a href="./contact.html">CONTACT</a>
    <a href="./builder/index.html">KNIFE BUILDER</a>
  </nav>

  <div class="nav-right">
    <a href="./cart.html" class="nav-cart-btn" aria-label="Cart">
      <img src="./productimages/shopping-cart.svg" alt="cart" />
    </a>

    <button class="nav-menu-btn" type="button" aria-label="Toggle menu">
      <img src="./productimages/menulogo.svg" alt="menu" />
    </button>
  </div>
</header>

<main class="product-page" style="padding-top:120px;">
  <section class="product-gallery" id="productRoot">
    <!-- Rendered by JS -->
  </section>
</main>

<div class="section-divider"></div>
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-newsletter">
      <h2 class="footer-newsletter-heading">STAY CONNECTED</h2>
      <form class="footer-newsletter-form" action="#" method="post">
        <input type="email" name="email" placeholder="Email address" required />
        <button type="submit">SUBSCRIBE</button>
      </form>
    </div>

    <div class="footer-main">
      <nav class="footer-nav">
        <a href="./index.html#shop">SHOP</a>
        <a href="./index.html#about">ABOUT</a>
        <a href="./contact.html">CONTACT</a>
      </nav>

      <a href="./index.html#top" class="footer-logo-link">
        <img src="./productimages/logowhite.svg" alt="Carson Woodall Knives" class="footer-logo" />
      </a>

      <div class="footer-social">
        <a href="#" aria-label="Instagram" class="footer-social-icon">IG</a>
        <a href="#" aria-label="Facebook" class="footer-social-icon">F</a>
        <a href="#" aria-label="YouTube" class="footer-social-icon">YT</a>
      </div>
    </div>

    <div class="footer-copy">© 2025 CARSON WOODALL KNIVES</div>
  </div>
</footer>

<script>
  // nav open/close
  const navBar = document.querySelector('.nav-bar');
  const menuBtn = document.querySelector('.nav-menu-btn');
  const navLinks = document.querySelectorAll('.nav-links a');
  if (navBar && menuBtn) {
    menuBtn.addEventListener('click', () => navBar.classList.toggle('nav-bar--open'));
    navLinks.forEach(link => link.addEventListener('click', () => navBar.classList.remove('nav-bar--open')));
  }

  // starter product data (replace later with JSON)
  const products = [
    {
      id: "mini-edc-01",
      title: "Mini EDC",
      price: 275,
      image: "./productimages/miniedc.jpeg",
      description: "Compact fixed blade built for daily carry. Clean lines, deliberate geometry.",
      specs: {
        steel: "Magnacut",
        finish: "Stonewash",
        handle: "Micarta",
      }
    },
    {
      id: "chef-01",
      title: "Chef Knife",
      price: 320,
      image: "./productimages/imgplaceholder.png",
      description: "Kitchen workhorse designed for balance and control.",
      specs: {
        steel: "AEB-L",
        finish: "Satin",
        handle: "G10",
      }
    }
  ];

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const product = products.find(p => p.id === id) || products[0];

  document.title = `${product.title} | Carson Woodall Knives`;

  const root = document.getElementById("productRoot");
  root.innerHTML = `
    <div class="main-image-container">
      <img src="${product.image}" alt="${product.title}">
    </div>

    <div class="product-options">
      <h1 style="letter-spacing:0.12em; text-transform:uppercase;">${product.title}</h1>
      <p style="opacity:0.85;">${product.description}</p>

      <div class="price-addcart">
        <div class="price">$${product.price}</div>
        <button class="add-cart" type="button">Add to Cart</button>
      </div>

      <div class="option-group">
        <label>Steel</label>
        <div style="padding:10px 0; opacity:0.9;">${product.specs.steel}</div>
      </div>
      <div class="option-group">
        <label>Finish</label>
        <div style="padding:10px 0; opacity:0.9;">${product.specs.finish}</div>
      </div>
      <div class="option-group">
        <label>Handle</label>
        <div style="padding:10px 0; opacity:0.9;">${product.specs.handle}</div>
      </div>
    </div>
  `;
</script>

</body>
</html>
