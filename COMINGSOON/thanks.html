<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscribed | Carson Woodall Knives</title>

  <style>
    :root {
      --bg-deep: #111;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #2a2a2a 0%, var(--bg-deep) 70%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: #f5f5f5;
      text-align: center;
      padding: 24px;
    }

    .confirm-wrap {
      max-width: 480px;
    }

    .confirm-title {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0.95;
    }

    .confirm-text {
      font-size: 0.95rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
      opacity: 0.75;
      margin-bottom: 36px;
    }

    .confirm-link {
      display: inline-block;
      text-decoration: none;
      color: #f5f5f5;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 10px 22px;
      border-radius: 999px;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .confirm-link:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="confirm-wrap">
    <h1 class="confirm-title">You’re on the list</h1>
    <p class="confirm-text">
      Thanks for subscribing.<br />
      You’ll hear from me when new work is ready.
    </p>

    <a href="/" class="confirm-link">Back to site</a>
  </div>
</body>
</html>
