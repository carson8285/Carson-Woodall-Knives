<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carson Woodall Knives | Coming Soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HERO SECTION -->
  <section class="landing-hero" id="top">
    <div class="coming-soon-wrap">
      <h1 class="coming-soon-text">COMING SOON</h1>
    </div>

    <div class="hero-logo-wrap">
      <img
        src="../productimages/logowhite.svg"
        alt="Carson Woodall Knives Logo"
        class="hero-logo"
      />
    </div>

    <!-- See Gallery Button -->
    <a href="#gallery" class="see-gallery-btn">See Gallery 🡓</a>
  </section>

  <!-- GALLERY SECTION -->
  <section class="landing-gallery" id="gallery">
    <h2>Our Work So Far</h2>
    <div class="gallery-grid">
      <img src="../productimages/miniedc.jpeg" alt="Knife 1">
      <img src="../productimages/imgplaceholder.png" alt="Knife 2">
      <img src="../productimages/imgplaceholder.png" alt="Knife 3">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">
      <img src="../productimages/imgplaceholder.png" alt="Knife 4">

      <!-- add more as needed -->
    </div>
  </section>

  <!-- Optional: smooth scrolling for anchor links -->
  <script>
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  </script>
   <!-- SECTION 5 – FOOTER -->
   <div class="section-divider"></div>
<footer class="footer">
  <div class="footer-inner">

    <!-- TOP: newsletter -->
    <div class="footer-newsletter">
      <h2 class="footer-newsletter-heading">STAY CONNECTED</h2>

      <form class="footer-newsletter-form" action="#" method="post">
        <input
          type="email"
          name="email"
          placeholder="Email address"
          required
        />
        <button type="submit">SUBSCRIBE</button>
      </form>
    </div>

    <!-- MIDDLE: nav · logo · socials -->
    <div class="footer-main">
      <nav class="footer-nav">
        <a href="shop.html">SHOP</a>
        <a href="index.html#about">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </nav>

      <a href="#top" class="footer-logo-link">
        <img
          src="../productimages/logowhite.svg"
          alt="Carson Woodall Knives"
          class="footer-logo"
        />
      </a>

      <div class="footer-social">
        <a href="#" aria-label="Instagram" class="footer-social-icon">IG</a>
        <a href="#" aria-label="Facebook" class="footer-social-icon">F</a>
        <a href="#" aria-label="YouTube" class="footer-social-icon">YT</a>
      </div>
    </div>

    <!-- BOTTOM: copyright -->
    <div class="footer-copy">
      © 2025 CARSON WOODALL KNIVES
    </div>
  </div>
</footer>
  
<script>
  const navBar = document.querySelector('.nav-bar');
  const menuBtn = document.querySelector('.nav-menu-btn');
  const navLinks = document.querySelectorAll('.nav-links a');

// Select your logo link
const logoLink = document.querySelector('.nav-logo-btn, .footer-logo-link'); 
// adjust selector depending on your actual class

logoLink.addEventListener('click', function (e) {

  // If NOT currently at the top of the page
  if (window.scrollY > 20) {
    e.preventDefault(); // stop link navigation
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } 
  // ELSE let the default <a href="index.html"> work normally
});

  if (navBar && menuBtn) {
    menuBtn.addEventListener('click', () => {
      navBar.classList.toggle('nav-bar--open');
    });

    // close when clicking a nav link
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        navBar.classList.remove('nav-bar--open');
      });
    });
  }

</body>
</html>
